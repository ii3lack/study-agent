[project]
name = "study-agent"
version = "0.1.0"
description = "学习开发 AI Agent 应用"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langfuse>=4.14.1",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "zai-sdk>=0.2.3",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[dependency-groups]
dev = [
    "black>=26.5.1",
]
